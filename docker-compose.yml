services:
  backend:
    build: .
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
      - static_volume:/app/staticfiles
    env_file:
      - .env
    expose:
      - "8000"
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 300 englishLMS.wsgi:application"
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - static_volume:/srv/static:ro
      - ./media:/srv/media:ro
    restart: always

volumes:
  static_volume:
